# Single free web service: builds React + runs FastAPI (serves UI + API)
# Deploy: https://dashboard.render.com/select-repo?type=blueprint
services:
  - type: web
    name: glof-portal
    runtime: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm install && VITE_API_URL= npm run build
      mkdir -p ../backend/static
      cp -r dist/* ../backend/static/
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        value: sqlite:////tmp/glof.db
      - key: SEED_ON_START
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
